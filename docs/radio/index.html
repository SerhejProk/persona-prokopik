<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e8ee">
<title>Интернет-радио</title>
<script async src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
// Тема по времени суток: с 7:00 до 20:00 светлая, остальное время тёмная. Проверяем раз в минуту.
// Для проверки можно открыть страницу с ?theme=night или ?theme=day.
(function () {
  var forced = (location.search.match(/theme=(day|night)/) || [])[1];
  function apply() {
    var h = new Date().getHours();
    var night = forced ? forced === "night" : (h < 7 || h >= 20);
    document.documentElement.setAttribute("data-theme", night ? "night" : "day");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", night ? "#2a2d34" : "#e4e8ee");
  }
  apply();
  setInterval(apply, 60000);
})();
</script>
<style>
  /* Неоморфизм: всё вылеплено из одного «пластика», свет падает слева сверху */
  /* Фон «Радиоволны»: круги расходятся от антенны в правом верхнем углу.
     Днём светлая тема, с 20:00 до 7:00 тёмная — тему ставит скрипт по часам (data-theme на <html>) */
  :root {
    --bg: #e4e8ee; --text: #2d3748; --muted: #718096; --accent: #2b6cb0;
    --light: #ffffff; --dark: #b8bec7; --ring: rgba(43, 108, 176, .13);
    --page: var(--bg); --edge: transparent;
    --out: 6px 6px 12px var(--dark), -6px -6px 12px var(--light);
    --out-sm: 3px 3px 6px var(--dark), -3px -3px 6px var(--light);
    --in: inset 4px 4px 8px var(--dark), inset -4px -4px 8px var(--light);
    --in-sm: inset 2px 2px 4px var(--dark), inset -2px -2px 4px var(--light);
  }
  /* Ночью кнопки и карточки светлее фона и с тонким светлым кантом — чтобы не сливались с темнотой */
  :root[data-theme="night"] {
    --page: #1a1c21; --bg: #2f333c; --text: #edf2f7; --muted: #a0aec0; --accent: #63b3ed;
    --light: #414753; --dark: #101114; --ring: rgba(99, 179, 237, .12); --edge: rgba(255, 255, 255, .09);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif; padding-bottom: 120px; }
  /* Неподвижный слой с волнами (background-attachment: fixed не работает на айфоне), к краям волны тают */
  .waves { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; pointer-events: none; overflow: hidden;
    background: repeating-radial-gradient(circle at calc(100% - 44px) 44px, transparent 0 56px, var(--ring) 56px 58px);
    -webkit-mask-image: radial-gradient(circle at calc(100% - 44px) 44px, #000 0, transparent 900px);
    mask-image: radial-gradient(circle at calc(100% - 44px) 44px, #000 0, transparent 900px); }
  /* Антенна и бегущие волны, пока играет станция */
  .antenna { position: fixed; top: 38px; right: 38px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); z-index: -1; pointer-events: none; }
  .antenna i { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
  .on-air .antenna i { animation: wave 3.6s ease-out infinite; }
  .on-air .antenna i:nth-child(2) { animation-delay: 1.2s; }
  .on-air .antenna i:nth-child(3) { animation-delay: 2.4s; }
  @keyframes wave { from { transform: scale(1); opacity: .55; } to { transform: scale(40); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .on-air .antenna i { animation: none; } }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 16px 8px; }
  h1 { margin: 0 0 4px; font-size: 26px; text-shadow: 1px 1px 1px var(--light), -1px -1px 1px var(--dark); }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .search { display: flex; gap: 14px; flex-wrap: wrap; }
  .search input, .search select { flex: 1 1 200px; padding: 12px 16px; border: 0; outline: 0;
    border-radius: 14px; background: var(--bg); color: var(--text); font: inherit; box-shadow: var(--in); }
  .search select { flex: 0 1 180px; cursor: pointer; }
  .search input::placeholder { color: var(--muted); }
  button { font: inherit; cursor: pointer; border: 0; background: var(--bg); color: var(--text); }
  .btn, .chip, .fav, .play, .card { border: 1px solid var(--edge); }
  .btn, .chip, .fav, .play, .card { transition: box-shadow .15s, color .15s, transform .1s; }
  .btn { padding: 12px 22px; border-radius: 14px; font-weight: 600; color: var(--accent); box-shadow: var(--out); }
  .btn:hover, .chip:hover, .fav:hover { color: var(--accent); }
  .btn:active { box-shadow: var(--in); transform: scale(.98); }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; margin: 22px 0 6px; }
  .chip { padding: 8px 16px; border-radius: 999px; box-shadow: var(--out-sm); }
  .chip:active { box-shadow: var(--in-sm); }
  .chip.on { box-shadow: var(--in-sm); color: var(--accent); font-weight: 600; }
  .opts { display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: 13px; margin-top: 12px; flex-wrap: wrap; }
  .opts input { accent-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px; }
  .status { color: var(--muted); margin: 8px 0 14px; min-height: 1.4em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
  .card { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--bg);
    border-radius: 18px; box-shadow: var(--out); cursor: pointer; min-width: 0; }
  .card:hover { transform: translateY(-1px); }
  .card:active { box-shadow: var(--in); transform: none; }
  .card.playing { box-shadow: var(--in); }
  .card.playing .name { color: var(--accent); }
  .logo { width: 48px; height: 48px; flex: none; border-radius: 12px; background: var(--bg); box-shadow: var(--in-sm);
    display: grid; place-items: center; overflow: hidden; font-weight: 700; color: var(--muted); padding: 4px; }
  .logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav { font-size: 17px; width: 36px; height: 36px; border-radius: 50%; padding: 0; flex: none; color: var(--muted); box-shadow: var(--out-sm); }
  .fav:active, .fav.on { box-shadow: var(--in-sm); }
  .fav.on { color: var(--accent); }
  .player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 -6px 14px var(--dark); }
  .player-in { max-width: 1100px; margin: 0 auto; display: flex; gap: 16px; align-items: center; }
  .play { width: 58px; height: 58px; border-radius: 50%; font-size: 19px; flex: none; color: var(--accent); box-shadow: var(--out); }
  .play:active:not(:disabled), .play.on { box-shadow: var(--in); }
  .play:disabled { color: var(--muted); cursor: default; }
  .now { flex: 1; min-width: 0; }
  .now .name { font-size: 16px; }
  /* Громкость: кнопки − и +, заполненная часть дорожки акцентным цветом */
  .volbox { display: flex; align-items: center; gap: 10px; flex: none; }
  .vbtn { width: 34px; height: 34px; border-radius: 50%; padding: 0; font-size: 20px; line-height: 1; font-weight: 700;
    color: var(--accent); box-shadow: var(--out-sm); border: 1px solid var(--edge); flex: none; }
  .vbtn:active { box-shadow: var(--in-sm); }
  .vol { -webkit-appearance: none; appearance: none; width: 130px; height: 10px; border-radius: 5px; outline: 0; margin: 0;
    background: linear-gradient(to right, var(--accent) 0, var(--accent) var(--v, 80%), transparent var(--v, 80%));
    box-shadow: var(--in-sm); border: 1px solid var(--edge); cursor: pointer; }
  .vol::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--bg); border: 3px solid var(--accent); box-shadow: var(--out-sm); cursor: pointer; }
  .vol::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--bg);
    border: 3px solid var(--accent); box-shadow: var(--out-sm); }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; grid-column: 1 / -1; }
  button, .card { -webkit-tap-highlight-color: transparent; }
  /* На телефоне громкость регулируют кнопками на корпусе — ползунок только мешает названию */
  @media (max-width: 520px) { .volbox { display: none; } h1 { font-size: 22px; } .grid { gap: 14px; }
    .search select { flex: 1 1 100%; } .btn { flex: 1 1 100%; } }
</style>
</head>
<body>
<div class="waves" aria-hidden="true"></div>
<div class="antenna" aria-hidden="true"><i></i><i></i><i></i></div>
<header>
  <h1>Интернет-радио</h1>
  <p class="sub">Тысячи станций со всего мира. Каталог: radio-browser.info</p>
  <form class="search" id="form">
    <input id="q" type="search" placeholder="Название станции или жанр…" autocomplete="off">
    <select id="country">
      <option value="">Все страны</option>
      <option value="RU">Россия</option>
      <option value="BY">Беларусь</option>
      <option value="KZ">Казахстан</option>
      <option value="PL">Польша</option>
      <option value="UA">Украина</option>
      <option value="US">США</option>
      <option value="GB">Великобритания</option>
      <option value="DE">Германия</option>
      <option value="FR">Франция</option>
      <option value="IT">Италия</option>
    </select>
    <button class="btn" type="submit">Найти</button>
  </form>
  <div class="chips" id="chips"></div>
  <div class="opts">
    <label><input type="checkbox" id="httpsOnly"> Только защищённые потоки (https)</label>
  </div>
</header>

<main>
  <div class="status" id="status">Если станции не появляются — откройте эту страницу в Safari или Chrome по ссылке serhejprok.github.io/persona-prokopik/radio/ (в режиме просмотра файла радио не работает).</div>
  <div class="grid" id="grid"></div>
</main>

<div class="player">
  <div class="player-in">
    <button class="play" id="play" disabled title="Играть / пауза">▶</button>
    <div class="logo" id="nowLogo">♪</div>
    <div class="now">
      <div class="name" id="nowName">Выберите станцию</div>
      <div class="meta" id="nowMeta">&nbsp;</div>
    </div>
    <div class="volbox">
      <button class="vbtn" id="volDown" title="Тише" aria-label="Тише">−</button>
      <input class="vol" id="vol" type="range" min="0" max="1" step="0.01" value="0.8" title="Громкость" aria-label="Громкость">
      <button class="vbtn" id="volUp" title="Громче" aria-label="Громче">+</button>
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
// Написано на старом JavaScript, чтобы сработать в любом браузере: показывает ошибку прямо на странице
window.onerror = function (msg, src, line) {
  if (msg === "Script error.") return; // ошибки чужих скриптов (hls.js с CDN) не показываем
  var el = document.getElementById("status");
  if (el) el.textContent = "Ошибка: " + msg + " (строка " + line + "). Пришлите этот текст разработчику.";
};
</script>
<script>
const SERVERS = ["https://de1.api.radio-browser.info", "https://nl1.api.radio-browser.info",
                 "https://at1.api.radio-browser.info", "https://de2.api.radio-browser.info"];
const PRESETS = [
  { label: "★ Избранное", fav: true },
  { label: "Популярное в России", country: "RU" },
  { label: "Беларусь", country: "BY" },
  { label: "Казахстан", country: "KZ" },
  { label: "Польша", country: "PL" },
  { label: "Поп", tag: "pop" },
  { label: "Рок", tag: "rock" },
  { label: "Джаз", tag: "jazz" },
  { label: "Классика", tag: "classical" },
  { label: "Электроника", tag: "electronic" },
  { label: "Ретро", tag: "oldies" },
  { label: "Lounge / Chill", tag: "chillout" },
  { label: "Новости", tag: "news" },
];

const $ = id => document.getElementById(id);
const audio = $("audio");
let hls = null, current = null, lastList = [], lastListRaw = [];

function store(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { return null; }
}
let favs = store("radio.favs") || [];
// На https-сайте (GitHub Pages) браузер не пускает http-потоки, поэтому там показываем только защищённые
if (location.protocol === "https:") {
  $("httpsOnly").checked = true;
  document.querySelector(".opts").hidden = true;
} else {
  $("httpsOnly").checked = store("radio.httpsOnly") === true;
}
function setVol(v) {
  v = Math.min(1, Math.max(0, Math.round(v * 100) / 100));
  audio.volume = v;
  $("vol").value = v;
  $("vol").style.setProperty("--v", (v * 100) + "%"); // заливка дорожки до бегунка
  store("radio.vol", v);
}
const savedVol = store("radio.vol");
setVol((typeof savedVol === "number") ? savedVol : 0.8);

async function api(path) {
  let lastErr;
  for (const s of SERVERS) {
    try {
      const r = await fetch(s + path);
      if (r.ok) return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("Каталог недоступен");
}

async function search({ name = "", tag = "", country = "" } = {}) {
  const p = new URLSearchParams({ limit: 120, hidebroken: "true", order: "clickcount", reverse: "true" });
  if (name) p.set("name", name);
  if (tag) p.set("tag", tag);
  if (country) p.set("countrycode", country);
  $("status").textContent = "Загружаю станции…";
  $("grid").innerHTML = "";
  try {
    let list = await api("/json/stations/search?" + p);
    // Если по названию ничего — пробуем как жанр
    if (!list.length && name && !tag) {
      p.delete("name"); p.set("tag", name.toLowerCase());
      list = await api("/json/stations/search?" + p);
    }
    render(list);
  } catch (e) {
    $("status").textContent = "Не удалось загрузить каталог. Проверьте интернет и попробуйте ещё раз.";
  }
}

function render(list) {
  lastListRaw = list;
  const httpsOnly = $("httpsOnly").checked;
  // Одна станция часто лежит в каталоге несколько раз — оставляем одну, предпочитая поток по https
  const byName = new Map();
  for (const s of list) {
    if (!s.url_resolved) continue;
    const secure = s.url_resolved.startsWith("https:");
    if (httpsOnly && !secure) continue;
    const key = s.name.trim().toLowerCase();
    const prev = byName.get(key);
    if (!prev || (secure && !prev.url_resolved.startsWith("https:"))) byName.set(key, s);
  }
  lastList = [...byName.values()];
  $("status").textContent = lastList.length ? `Найдено станций: ${lastList.length}` : "";
  const grid = $("grid");
  grid.innerHTML = "";
  if (!lastList.length) {
    grid.innerHTML = '<div class="empty">Ничего не найдено. Попробуйте другой запрос или снимите галочку «только https».</div>';
    return;
  }
  for (const s of lastList) grid.appendChild(card(s));
}

function logoEl(s) {
  const d = document.createElement("div");
  d.className = "logo";
  d.textContent = (s.name.trim()[0] || "♪").toUpperCase();
  // Пробуем по очереди: логотип из каталога → он же по https → значок официального сайта станции.
  // Если ничего не загрузилось (или картинка-заглушка меньше 24px) — остаётся первая буква.
  const sources = logoSources(s);
  const tryNext = () => {
    const src = sources.shift();
    if (!src) return;
    const img = new Image();
    let done = false;
    const next = () => { if (!done) { done = true; img.src = ""; tryNext(); } };
    const timer = setTimeout(next, 4000); // некоторые сервера не отвечают — не ждём их вечно
    img.referrerPolicy = "no-referrer";
    img.onload = () => {
      if (done) return;
      if (img.naturalWidth < 24) return next();
      done = true; clearTimeout(timer);
      d.textContent = ""; d.appendChild(img);
    };
    img.onerror = () => { clearTimeout(timer); next(); };
    img.src = src;
  };
  tryNext();
  return d;
}

function logoSources(s) {
  const list = [];
  const fav = (s.favicon || "").trim();
  if (fav) {
    list.push(fav);
    if (fav.startsWith("http:")) list.push("https:" + fav.slice(5));
  }
  try {
    const host = new URL(s.homepage).hostname;
    if (host) {
      list.push(`https://www.google.com/s2/favicons?domain=${host}&sz=128`);
      list.push(`https://icons.duckduckgo.com/ip3/${host}.ico`);
    }
  } catch (e) {}
  return list;
}

function metaText(s) {
  const tags = (s.tags || "").split(",").filter(Boolean).slice(0, 3).join(", ");
  return [s.country, tags, s.bitrate ? s.bitrate + " kbps" : ""].filter(Boolean).join(" · ");
}

function card(s) {
  const c = document.createElement("div");
  c.className = "card" + ((current && current.stationuuid) === s.stationuuid ? " playing" : "");
  c.dataset.id = s.stationuuid;
  c.appendChild(logoEl(s));
  const info = document.createElement("div");
  info.className = "info";
  info.innerHTML = '<div class="name"></div><div class="meta"></div>';
  info.firstChild.textContent = s.name.trim();
  info.lastChild.textContent = metaText(s);
  c.appendChild(info);
  const f = document.createElement("button");
  const isFav = () => favs.some(x => x.stationuuid === s.stationuuid);
  f.className = "fav" + (isFav() ? " on" : "");
  f.textContent = isFav() ? "★" : "☆";
  f.title = "В избранное";
  f.onclick = e => {
    e.stopPropagation();
    favs = isFav() ? favs.filter(x => x.stationuuid !== s.stationuuid) : [...favs, s];
    store("radio.favs", favs);
    f.className = "fav" + (isFav() ? " on" : "");
    f.textContent = isFav() ? "★" : "☆";
  };
  c.appendChild(f);
  c.onclick = () => playStation(s);
  return c;
}

function markPlaying() {
  document.querySelectorAll(".card").forEach(c =>
    c.classList.toggle("playing", c.dataset.id === (current && current.stationuuid)));
}

function playStation(s) {
  current = s;
  store("radio.last", s);
  $("nowName").textContent = s.name.trim();
  $("nowMeta").textContent = "Подключаюсь…";
  $("nowLogo").replaceWith(Object.assign(logoEl(s), { id: "nowLogo" }));
  $("play").disabled = false;
  markPlaying();
  setMediaSession(s);

  if (hls) { hls.destroy(); hls = null; }
  const url = s.url_resolved;
  const isHls = /\.m3u8(\?|$)/i.test(url) || (s.hls == 1);
  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(audio);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) failed(); });
  } else {
    audio.src = url;
  }
  audio.play().catch(err => { if (err.name !== "AbortError") failed(); });
  fetch(SERVERS[0] + "/json/url/" + s.stationuuid).catch(() => {}); // учёт прослушивания в каталоге
}

// Название и логотип на экране блокировки телефона, кнопки пауза/играть в шторке
function setMediaSession(s) {
  if (!("mediaSession" in navigator)) return;
  const art = logoSources(s).slice(0, 1).map(src => ({ src, sizes: "512x512" }));
  navigator.mediaSession.metadata = new MediaMetadata({ title: s.name.trim(), artist: "Интернет-радио", artwork: art });
  navigator.mediaSession.setActionHandler("play", () => playStation(current));
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
}

function failed() {
  document.documentElement.classList.remove("on-air");
  $("nowMeta").textContent = "Станция сейчас не отвечает — выберите другую";
  $("play").textContent = "▶";
  $("play").classList.remove("on");
}

audio.addEventListener("playing", () => { $("play").textContent = "❚❚"; $("play").classList.add("on"); document.documentElement.classList.add("on-air"); $("nowMeta").textContent = metaText(current) || "В эфире"; });
audio.addEventListener("pause", () => { $("play").textContent = "▶"; $("play").classList.remove("on"); document.documentElement.classList.remove("on-air"); });
audio.addEventListener("waiting", () => { $("nowMeta").textContent = "Буферизация…"; });
audio.addEventListener("error", () => { if (audio.src) failed(); });

$("play").onclick = () => {
  if (!current) return;
  if (audio.paused) {
    // Для живого эфира переподключаемся, чтобы не играть «из прошлого»
    playStation(current);
  } else {
    audio.pause();
  }
};
$("vol").oninput = e => setVol(+e.target.value);
$("volDown").onclick = () => setVol(audio.volume - 0.1);
$("volUp").onclick = () => setVol(audio.volume + 0.1);
$("httpsOnly").onchange = e => { store("radio.httpsOnly", e.target.checked); render(lastListRaw); };

function setChip(i) {
  document.querySelectorAll(".chip").forEach((c, j) => c.classList.toggle("on", j === i));
}

PRESETS.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = p.label;
  b.onclick = () => {
    setChip(i);
    $("q").value = ""; $("country").value = p.country || "";
    if (p.fav) {
      render(favs);
      if (!favs.length) $("grid").innerHTML = '<div class="empty">Пока пусто. Нажмите ☆ у станции, чтобы добавить её сюда.</div>';
    } else {
      search({ tag: p.tag, country: p.country });
    }
  };
  $("chips").appendChild(b);
});

$("form").onsubmit = e => {
  e.preventDefault();
  setChip(-1);
  search({ name: $("q").value.trim(), country: $("country").value });
};

// Старт: последняя станция в плеере + популярное в России
const last = store("radio.last");
if (last) {
  current = last;
  $("nowName").textContent = last.name.trim();
  $("nowMeta").textContent = "Нажмите ▶, чтобы продолжить";
  $("nowLogo").replaceWith(Object.assign(logoEl(last), { id: "nowLogo" }));
  $("play").disabled = false;
}
setChip(1);
search({ country: "RU" });
</script>
</body>
</html>
